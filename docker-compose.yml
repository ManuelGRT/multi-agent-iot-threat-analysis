# docker-compose.yml
services:
  api:
    build:
      context: .
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "8000:8000"
    environment:
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:?Define MISTRAL_API_KEY en el archivo .env}"
      INGEST_LLM_MODEL: "${INGEST_LLM_MODEL:-mistral-small-2603}"
      MITIGATOR_LLM_MODEL: "${MITIGATOR_LLM_MODEL:-mistral-small-2603}"
      TFM_STATE_DIR: /var/lib/tfm_multiagent
    volumes:
      - runtime_state:/var/lib/tfm_multiagent
    tmpfs:
      - /tmp

volumes:
  runtime_state:
